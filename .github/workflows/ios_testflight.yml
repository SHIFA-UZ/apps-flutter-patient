name: iOS TestFlight Deployment

# Tests run on pull requests (ci.yml), not here.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # build number = offset + github.run_number. Set offset so the first run is above
  # the last TestFlight build of uz.shifa.patient.
  BUILD_NUMBER_OFFSET: 19

jobs:
  build-and-deploy-ios:
    name: Build and Deploy iOS to TestFlight
    runs-on: macos-latest
    # macOS minutes are billed at 10x. Cap so a hung run doesn't burn hours.
    timeout-minutes: 40

    steps:
      #########################
      # PHASE 1: CHECKOUT & SETUP
      #########################

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      # setup-xcode selects Xcode 26 but does NOT install its iOS runtime.
      # Fail loudly if the download fails — a masked failure here surfaces
      # later as a confusing build error.
      - name: Install iOS platform
        run: |
          set -euo pipefail
          xcodebuild -downloadPlatform iOS
          xcodebuild -showsdks | grep -i ios

      # Xcode's "Compile Kotlin Framework" build phase runs Gradle.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      #########################
      # PHASE 2: FIREBASE CONFIGURATION
      #########################

      - name: Decode Firebase iOS config
        env:
          FIREBASE_IOS_CONFIG_BASE64: ${{ secrets.FIREBASE_IOS_CONFIG_BASE64 }}
        run: |
          if [ -z "$FIREBASE_IOS_CONFIG_BASE64" ]; then
            echo "FIREBASE_IOS_CONFIG_BASE64 secret not found!"
            exit 1
          fi
          echo "$FIREBASE_IOS_CONFIG_BASE64" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
          plutil -lint iosApp/iosApp/GoogleService-Info.plist

      #########################
      # PHASE 3: FASTLANE
      #########################

      - name: Setup Ruby & cache gems (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: iosApp
          bundler-cache: true

      #########################
      # PHASE 4: VERSIONING
      #########################

      - name: Calculate version
        id: version
        run: |
          BUILD_NUMBER=$(( BUILD_NUMBER_OFFSET + ${{ github.run_number }} ))
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Build: $BUILD_NUMBER"

      #########################
      # PHASE 5: CODE SIGNING SETUP
      #########################

      - name: Import iOS Distribution Certificate
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "IOS_CERTIFICATE_P12_BASE64 secret not found!"
            exit 1
          fi

          CERT_DIR=$(mktemp -d)
          CERT_PATH="$CERT_DIR/certificate.p12"

          KEYCHAIN_NAME="ci-build.keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          rm -rf "$CERT_DIR"

      #########################
      # PHASE 6: FASTLANE - BUILD, SIGN, ARCHIVE & UPLOAD
      #########################

      - name: Setup App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY_CONTENT" > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${API_KEY_ID}.p8

      # Xcode's "Compile Kotlin Framework" phase reuses this; building it here prints Kotlin errors in full
      # (fastlane only shows Xcode's summary).
      - name: Build Kotlin framework
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon

      - name: Build, Sign and Upload to TestFlight with Fastlane
        working-directory: iosApp
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: bundle exec fastlane beta

      #########################
      # PHASE 7: ARTIFACTS & CLEANUP
      #########################

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.version.outputs.build_number }}
          path: |
            iosApp/build/logs/**/*
            ~/Library/Logs/gym/**/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup sensitive files
        if: always()
        run: rm -rf ~/private_keys

      #########################
      # PHASE 8: SUMMARY
      #########################

      - name: Deployment Summary
        if: success()
        run: |
          echo "============================================="
          echo "  iOS TestFlight Deployment Successful"
          echo "============================================="
          echo "  Bundle ID: uz.shifa.patient"
          echo "  Build: ${{ steps.version.outputs.build_number }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Apple processing: ~10-20 minutes"
          echo "============================================="

      - name: Failure Summary
        if: failure()
        run: |
          echo "============================================="
          echo "  iOS TestFlight Deployment FAILED"
          echo "============================================="
          echo "  Common issues:"
          echo "    - Missing or invalid secrets"
          echo "    - Code signing problems"
          echo "    - Build number already used (raise BUILD_NUMBER_OFFSET)"
          echo "============================================="
