name: Deploy to Google Play Store

# Tests run on pull requests (ci.yml), not here.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  # versionCode = offset + github.run_number. Set offset so the first run is above
  # the current Play Store versionCode of com.shifa.patientapp.
  VERSION_CODE_OFFSET: 19

jobs:
  build-and-deploy:
    name: Build & Deploy to Play Store (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      #########################
      # PHASE 1: CHECKOUT & SETUP
      #########################

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      #########################
      # PHASE 2: FIREBASE CONFIGURATION
      #########################

      - name: Decode Firebase Android config
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            echo "::error::FIREBASE_ANDROID_CONFIG_BASE64 secret not found!"
            exit 1
          fi
          echo "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > composeApp/google-services.json

      #########################
      # PHASE 3: VERSIONING
      #########################

      - name: Calculate version
        id: version
        run: |
          BUILD_NUMBER=$(( VERSION_CODE_OFFSET + ${{ github.run_number }} ))
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "versionCode: $BUILD_NUMBER"

      #########################
      # PHASE 4: SIGNING
      #########################

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret not found!"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > composeApp/upload-keystore.jks

      - name: Create keystore.properties
        run: |
          cat > keystore.properties << EOF
          storeFile=composeApp/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Verify upload keystore fingerprint
        env:
          EXPECTED_UPLOAD_KEY_SHA1: E3:33:88:4E:68:DF:39:0F:F5:12:90:4C:48:A1:20:33:2C:AF:CF:D3
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ACTUAL_SHA1=$(keytool -list -v \
            -keystore composeApp/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" 2>/dev/null | awk '/SHA1:/ {print $2; exit}')
          if [ -z "$ACTUAL_SHA1" ]; then
            echo "::error::Could not read keystore certificate. Check ANDROID_KEYSTORE_* secrets."
            exit 1
          fi
          echo "Upload key SHA1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_UPLOAD_KEY_SHA1" ]; then
            echo "::error::Wrong upload keystore."
            echo "Expected: $EXPECTED_UPLOAD_KEY_SHA1"
            echo "Actual:   $ACTUAL_SHA1"
            echo "Update GitHub secret ANDROID_KEYSTORE_BASE64 with the original Play upload keystore."
            exit 1
          fi

      #########################
      # PHASE 5: BUILD AAB
      #########################

      - name: Build Android App Bundle
        run: ./gradlew :composeApp:bundleRelease -PversionBuild=${{ steps.version.outputs.build_number }} --no-daemon

      - name: Verify AAB file
        run: |
          AAB_PATH="composeApp/build/outputs/bundle/release/composeApp-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::AAB file not found at $AAB_PATH"
            exit 1
          fi
          echo "AAB built successfully: $(du -h "$AAB_PATH" | cut -f1)"

      #########################
      # PHASE 6: UPLOAD TO GOOGLE PLAY
      #########################

      - name: Decode Google Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 secret not found!"
            exit 1
          fi
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64" | base64 --decode > google-play-service-account.json

      - name: Upload to Google Play (Production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: google-play-service-account.json
          packageName: com.shifa.patientapp
          releaseFiles: composeApp/build/outputs/bundle/release/composeApp-release.aab
          track: production
          status: completed

      #########################
      # PHASE 7: ARTIFACTS & CLEANUP
      #########################

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.build_number }}
          path: composeApp/build/outputs/bundle/release/composeApp-release.aab
          retention-days: 30

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f composeApp/upload-keystore.jks
          rm -f keystore.properties
          rm -f google-play-service-account.json

      #########################
      # PHASE 8: SUMMARY
      #########################

      - name: Deployment Summary
        if: success()
        run: |
          echo "==========================================="
          echo "  Google Play Store Deployment Successful"
          echo "==========================================="
          echo "  Package: com.shifa.patientapp"
          echo "  versionCode: ${{ steps.version.outputs.build_number }}"
          echo "  Track: Production (full rollout)"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Triggered by: ${{ github.actor }}"
          echo "==========================================="

      - name: Failure Summary
        if: failure()
        run: |
          echo "==========================================="
          echo "  Google Play Deployment FAILED"
          echo "==========================================="
          echo "  Common issues:"
          echo "    - Missing or invalid secrets"
          echo "    - Keystore signing problems"
          echo "    - versionCode already used (raise VERSION_CODE_OFFSET)"
          echo "    - Service account missing permissions"
          echo "==========================================="
